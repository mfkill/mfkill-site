<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rapanoia</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
  :root { --ink:#ECEAE4; --dim:#8b8a86; --line:#2a2a2a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
    font-family: Georgia, "Times New Roman", serif; -webkit-user-select:none; user-select:none; }
  /* ---- accesso ---- */
  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:min(380px,100%); text-align:center; }
  .card h1 { margin:0 0 6px; font-size:clamp(2rem,9vw,2.8rem); letter-spacing:.14em; font-weight:400; }
  .card .sub { margin:0 0 34px; color:var(--dim); font-style:italic; font-size:1rem; }
  .card .by { margin:0 0 26px; color:var(--dim); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; }
  .card form { display:flex; flex-direction:column; gap:12px; }
  .card input { font:inherit; font-size:1.05rem; text-align:center; letter-spacing:.2em; color:var(--ink); background:transparent;
    border:1px solid var(--line); border-radius:3px; padding:14px; outline:none; -webkit-user-select:text; user-select:text; }
  .card input:focus { border-color:#6b6a66; }
  .card button { font:inherit; color:#000; background:var(--ink); border:0; border-radius:3px; padding:14px; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem; }
  .err { min-height:1.2em; color:#c9645a; font-size:.85rem; margin:2px 0 0; }
  .shake { animation:sh .35s; } @keyframes sh { 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  /* ---- galleria ---- */
  #viewer { position:fixed; inset:0; display:none; }
  #scroller { position:absolute; inset:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
    scrollbar-width:none; overscroll-behavior:contain; touch-action:pan-x; -webkit-overflow-scrolling:touch; }
  #scroller::-webkit-scrollbar { display:none; }
  #scroller.zoomed { touch-action:none; scroll-snap-type:none; overflow-x:hidden; }
  .slide { flex:0 0 100vw; width:100vw; height:100dvh; scroll-snap-align:center; scroll-snap-stop:always;
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .slide img { max-width:100vw; max-height:100dvh; width:auto; height:auto; object-fit:contain; display:block;
    transform-origin:0 0; will-change:transform; pointer-events:none; -webkit-user-drag:none; opacity:0; transition:opacity .25s; }
  .slide img.on { opacity:1; }
  .slide img.anim { transition:transform .2s, opacity .25s; }
  .end { flex-direction:column; text-align:center; padding:28px; }
  .end h2 { margin:0 0 12px; font-weight:400; letter-spacing:.1em; font-size:clamp(1.4rem,6vw,2rem); }
  .end p { margin:0 0 20px; color:var(--dim); max-width:26rem; line-height:1.5; }
  .end a { color:var(--ink); border-bottom:1px solid #666; text-decoration:none; padding-bottom:2px; -webkit-user-select:text; user-select:text; }
  #hud { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 10px); text-align:center; z-index:3;
    font-size:.75rem; letter-spacing:.2em; color:#9a9994; pointer-events:none; text-shadow:0 0 6px #000; }
  #bar { position:fixed; left:0; bottom:0; height:2px; background:#ECEAE4; width:0; z-index:3; transition:width .2s; }
  .arrow { position:fixed; top:50%; transform:translateY(-50%); z-index:3; width:48px; height:80px; border:0; background:transparent;
    color:#ECEAE4; font-size:2.2rem; opacity:.0; transition:opacity .2s; display:none; }
  @media (hover:hover) and (pointer:fine) { .arrow { display:block; } #viewer:hover .arrow { opacity:.45; } .arrow:hover { opacity:1 !important; } }
  #prev { left:8px; } #next { right:8px; }
</style>
</head>
<body>
<main id="gate">
  <div class="card" id="card">
    <h1 id="g-title">RAPANOIA</h1>
    <p class="sub" id="g-sub"></p>
    <p class="by" id="g-by"></p>
    <form id="form" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">Entra</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
</main>

<div id="viewer">
  <div id="scroller"></div>
  <button class="arrow" id="prev" aria-label="Pagina precedente">‹</button>
  <button class="arrow" id="next" aria-label="Pagina successiva">›</button>
  <div id="hud"></div><div id="bar"></div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const C = window.RAPANOIA;
  const $ = id => document.getElementById(id);
  $("g-title").textContent = C.title; $("g-sub").textContent = C.subtitle || ""; $("g-by").textContent = C.author || "";
  document.title = C.title;

  async function sha(s) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  const NOPW = !C.hash;
  if (NOPW) { $("pw").style.display = "none"; $("pw").required = false; $("form").querySelector("button").textContent = "Leggi"; }
  const KEY = "rap_ok_" + (C.hash || "open").slice(0, 12);
  let built = false;
  let ok = false; try { ok = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
  if (ok && !NOPW) open();

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const v = $("pw").value.trim();
    let good = false;
    if (NOPW) { open(); return; }
    try { good = (await sha(C.salt + v)) === C.hash; } catch (err) { $("err").textContent = "Il browser non supporta l'accesso. Prova da Safari o Chrome."; return; }
    if (good) { try { sessionStorage.setItem(KEY, "1"); } catch (e) {} open(); }
    else { $("err").textContent = "Password non corretta."; $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake"); $("pw").select(); }
  });

  // ================= galleria =================
  function open() {
    $("gate").style.display = "none"; $("viewer").style.display = "block";
    if (!built) { built = true; build(); }
  }
  function build() {
    const sc = $("scroller"), N = C.pages, TOTAL = N + 1; // +1 schermata finale
    const slides = [], imgs = [];
    const pad = n => String(n).padStart(3, "0");
    for (let i = 1; i <= N; i++) {
      const s = document.createElement("div"); s.className = "slide";
      const im = document.createElement("img"); im.alt = "Tavola " + i; im.draggable = false; im.decoding = "async";
      im.dataset.src = "pagine/" + pad(i) + "." + C.ext;
      im.addEventListener("load", () => im.classList.add("on"));
      s.appendChild(im); sc.appendChild(s); slides.push(s); imgs.push(im);
    }
    const end = document.createElement("div"); end.className = "slide end";
    end.innerHTML = "<h2></h2><p></p>" + (C.email ? '<a href="mailto:' + C.email + '">' + C.email + "</a>" : "");
    end.querySelector("h2").textContent = C.endTitle; end.querySelector("p").textContent = C.endText;
    sc.appendChild(end); slides.push(end);

    let cur = 0;
    const load = i => { const im = imgs[i]; if (im && !im.src) im.src = im.dataset.src; };
    function around(i) { for (let k = i - 1; k <= i + 3; k++) load(k); }
    function hud() {
      $("hud").textContent = cur < N ? (cur + 1) + " / " + N : "";
      $("bar").style.width = (Math.min(cur + 1, N) / N * 100) + "%";
    }
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > 0.6) { const i = slides.indexOf(e.target); if (i !== cur) { cur = i; resetZoom(); } around(cur); hud(); } });
    }, { root: sc, threshold: [0.6] });
    slides.forEach(s => io.observe(s));
    around(0); hud();

    function go(i) { i = Math.max(0, Math.min(TOTAL - 1, i)); sc.scrollTo({ left: i * sc.clientWidth, behavior: "smooth" }); }
    $("next").onclick = () => go(cur + 1); $("prev").onclick = () => go(cur - 1);
    addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
      else if (e.key === "Home") go(0); else if (e.key === "End") go(TOTAL - 1);
    });
    addEventListener("resize", () => { sc.scrollTo({ left: cur * sc.clientWidth, behavior: "auto" }); resetZoom(); });

    // ---------- zoom (pizzico, doppio tap, trascinamento) ----------
    const MAX = 4, DBL = 2.5;
    let z = 1, tx = 0, ty = 0;
    const ptr = new Map(); let mode = null, start = null, lastTap = 0, lastTapX = 0, lastTapY = 0;
    const curImg = () => imgs[cur];
    function apply(anim) {
      const im = curImg(); if (!im) return;
      im.classList.toggle("anim", !!anim);
      im.style.transform = z === 1 ? "" : "translate(" + tx + "px," + ty + "px) scale(" + z + ")";
      sc.classList.toggle("zoomed", z > 1.001);
    }
    function clamp() {
      const im = curImg(); if (!im) return;
      const w = im.offsetWidth * z, h = im.offsetHeight * z, vw = innerWidth, vh = innerHeight;
      const baseL = (vw - im.offsetWidth) / 2, baseT = (vh - im.offsetHeight) / 2;
      tx = w > vw ? Math.min(-baseL, Math.max(vw - w - baseL, tx)) : (vw - w) / 2 - baseL;
      ty = h > vh ? Math.min(-baseT, Math.max(vh - h - baseT, ty)) : (vh - h) / 2 - baseT;
    }
    function resetZoom() { z = 1; tx = ty = 0; const im = curImg(); if (im) { im.style.transform = ""; im.classList.remove("anim"); } sc.classList.remove("zoomed"); }
    function zoomAt(nz, cx, cy, anim) {
      const im = curImg(); if (!im) return;
      nz = Math.max(1, Math.min(MAX, nz));
      const baseL = (innerWidth - im.offsetWidth) / 2, baseT = (innerHeight - im.offsetHeight) / 2;
      // punto dell'immagine (non zoomata) sotto il centro del gesto
      const px = (cx - baseL - tx) / z, py = (cy - baseT - ty) / z;
      z = nz; tx = cx - baseL - px * z; ty = cy - baseT - py * z;
      if (z <= 1.001) { z = 1; tx = ty = 0; } else clamp();
      apply(anim);
    }
    const dist = () => { const [a, b] = [...ptr.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
    const mid = () => { const [a, b] = [...ptr.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
    sc.addEventListener("pointerdown", e => {
      if (cur >= N) return;
      ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptr.size === 2) { mode = "pinch"; const m = mid(); start = { d: dist(), z, cx: m.x, cy: m.y }; sc.classList.add("zoomed"); }
      else if (ptr.size === 1) { mode = z > 1 ? "pan" : "tap"; start = { x: e.clientX, y: e.clientY, tx, ty, t: performance.now(), moved: false }; }
    });
    sc.addEventListener("pointermove", e => {
      if (!ptr.has(e.pointerId)) return;
      ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (mode === "pinch" && ptr.size >= 2) { const m = mid(); zoomAt(start.z * dist() / start.d, m.x, m.y, false); }
      else if (mode === "pan" && z > 1) { tx = start.tx + (e.clientX - start.x); ty = start.ty + (e.clientY - start.y); clamp(); apply(false); }
      else if (mode === "tap" && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) start.moved = true;
    });
    function up(e) {
      if (!ptr.has(e.pointerId)) return;
      const was = mode; ptr.delete(e.pointerId);
      if (was === "tap" && start && !start.moved && performance.now() - start.t < 350) {
        const now = performance.now();
        if (now - lastTap < 300 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 30) { lastTap = 0; zoomAt(z > 1.05 ? 1 : DBL, e.clientX, e.clientY, true); }
        else { lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY; }
      }
      if (ptr.size === 1) { const p = [...ptr.values()][0]; mode = "pan"; start = { x: p.x, y: p.y, tx, ty, t: 0, moved: true }; }
      else if (ptr.size === 0) { mode = null; if (z <= 1.02) { z = 1; tx = ty = 0; apply(true); } }
    }
    sc.addEventListener("pointerup", up); sc.addEventListener("pointercancel", up);
    sc.addEventListener("dblclick", e => { if (cur < N && e.pointerType !== "touch") zoomAt(z > 1.05 ? 1 : DBL, e.clientX, e.clientY, true); });
    sc.addEventListener("wheel", e => { if (z > 1 && (e.ctrlKey || e.metaKey)) { e.preventDefault(); zoomAt(z * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX, e.clientY, false); } }, { passive: false });
    // blocca menu/tasto destro sulle tavole e gesture native di Safari
    addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest("#viewer")) e.preventDefault(); });
    ["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  }
})();
</script>
</body>
</html>
