<script>
  // Pagina globale di apertura predefinita per QUESTO volume: calcolata
  // sommando le pagine di tutti gli episodi che vengono prima nel manifest,
  // così non va mai aggiornata a mano quando cambi l'ordine di volumi o
  // episodi. Se il primo episodio del volume ha una copertina
  // (coverPages in manifest.js), l'apertura la salta e mostra subito la
  // prima tavola numerata — la copertina resta comunque raggiungibile
  // scorrendo indietro.
  const ENTRY_PAGE = (function () {
    let cursor = 1;
    for (const ep of EPISODES) {
      if (ep.volume === "vol0") return cursor + (ep.coverPages || 0);
      cursor += ep.pages;
    }
    return 1;
  })();
</script>
